# Publishes the website (site/ plus the web fonts) to GitHub Pages whenever
# the site or the fonts change on main. The page reads its version and
# character list from the fonts (sources/scripts/make_site.py).
#
# One-time setup: Settings > Pages > Build and deployment > Source:
# "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "fonts/and_Lubrifont/**", "sources/scripts/make_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python sources/scripts/make_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
